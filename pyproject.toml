[project]
name = "smartpick"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "langchain>=1.0.3",
    "langchain-core>=1.2.11",
    "langchain-upstage>=0.7.6",
    "langgraph>=1.0.2",
    "openai>=2.2.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.1.1",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.35.0",
    "pymupdf4llm>=1.27.2.2",
    "supabase>=2.28.3",
    "loguru>=0.7.3",
    "logtail-python>=0.3.2",
    "langfuse>=4.0.6",
    "langsmith>=0.7.1",
    "pycircuitbreaker>=0.5.0",
    "logtail-python>=0.3.4",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
# tests/ 디렉토리만 pytest 수집 대상으로 제한.
# calc_refactor/ 안에는 HTTP 호출이 필요한 통합 스크립트가 있어 단위 테스트로 부적절.
testpaths = ["tests"]
